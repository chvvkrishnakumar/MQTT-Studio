name: Build installers

# Build clean installers for macOS, Windows and Linux — each on its own native
# runner (required because the native better-sqlite3 module can't be reliably
# cross-compiled).
#
# Triggers:
#   • push to main/master  -> builds + uploads installers as run artifacts
#   • push a v* tag        -> also publishes a GitHub Release with the installers
#   • manual (Actions tab) -> "Run workflow"
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native deps for Electron
        run: npm run rebuild-deps

      - name: Build installers
        run: npm run ${{ matrix.script }}

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            app/release/*.dmg
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*.dmg
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb

  update-readme:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update README stable links to new tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "Updating README to $TAG (version $VERSION)"
          # Update releases/tag/vX.Y.Z link
          sed -i "s|releases/tag/v[0-9.]*|releases/tag/${TAG}|g" README.md
          # Update filenames MQTT-Studio-X.Y.Z
          sed -i "s|MQTT-Studio-[0-9.]*|MQTT-Studio-${VERSION}|g" README.md
          # Update title vX.Y.Z
          sed -i "s|# MQTT Studio — v[0-9.]*|# MQTT Studio — ${TAG}|g" README.md
          sed -i "s|> \*\*v[0-9.]*|> **${TAG}|g" README.md
          sed -i "s|### v[0-9.]* —|### ${TAG} —|g" README.md
          sed -i "s|git tag v[0-9.]*|git tag ${TAG}|g" README.md
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README download links for ${TAG} [skip ci]"
          git push origin HEAD:main

  # Dev artifacts: no per-run ID rewrite needed — README now points to
  # https://github.com/.../actions/workflows/build.yml (stable latest-run link).
